<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="images/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>•ᴗ•</title>
  <style>
    :root {
      --bg-body: #f0f0f0;
      --text-main: #333;
      --text-source: #666;
      --link-color: #0077cc;
    }

    /* Variables pour le Mode Sombre */
    [data-theme="dark"] {
      --bg-body: #0a0a0a;
      --text-main: #f5f5f7;
      --text-source: #a1a1a6;
      --link-color: #5db0ff;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img {
      max-width: 300px; /* Taille de l'image réduite */
      width: 100%;
      height: auto;
      margin-bottom: 20px;
    }

    .text {
      font-size: 1.2em;
      color: var(--text-main);
      max-width: 80%;
    }

    .source {
      font-size: 0.9em;
      color: var(--text-source);
      margin-top: 20px;
    }

    .source a {
      color: var(--link-color);
      text-decoration: none;
    }

    .source a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Leonardo_da_Vinci_043-mod.jpg" alt="Mona Lisa">
    <div class="text">
      You'll really think this page is really useful?... but thanks to Wikipedia for the Zoom image in the Public Domain of Mona Lisa created by Leonardo da Vinci.
    </div>
    <div class="source">
      Image source: <a href="https://commons.wikimedia.org/wiki/File:Leonardo_da_Vinci_043-mod.jpg" target="_blank">Wikimedia Commons</a>
    </div>
  </div>

  <script>
    // Détection et application du Thème (Sombre / Clair)
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
