<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impossible Password Generator</title>
    <style>
        :root {
            /* Default Dark Theme */
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text: #1e293b;
            --border: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .password-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        button {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        button:hover {
            transform: scale(1.02);
        }

        /* Simple modal for security warnings */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Impossible Password Generator</h1>
        <div class="password-box" id="password-display">
            ••••••••••••••••••••••••••••••••
        </div>
        <button onclick="showWarning()">Generate Unhackable Password</button>
    </div>

    <div id="warningModal" class="modal">
        <div class="modal-content">
            <h2>⚠️ Security Warning</h2>
            <p>This password will be extremely long and contains characters that many websites might not support. Do you wish to proceed?</p>
            <button onclick="generateImpossiblePassword(); closeModal()">Proceed</button>
            <button onclick="closeModal()" style="background: grey; margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <script>
        /*
          This Software is released under the MIT No Attribution (MIT-0) License.
        */

        // --- 1. APPLY THEME ---
        function applyTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // --- 2. GENERATOR LOGIC ---
        function showWarning() {
            document.getElementById('warningModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('warningModal').style.display = 'none';
        }

        function generateImpossiblePassword() {
            const display = document.getElementById('password-display');
            const charPool = [
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()',
                '💀🤡👽👾🤖👻👹👺💥🧠🦾🛰️🌀🔏🛡️🧿',
                '∑∏∫∬∭∮∯∰∇√∛∜∞∟∠∱∲∳ℵℶℷℸ',
                '業彙適編𓀀𓀁𓀂𓀃𓀄𓀅𓀆𓀇𓀈𓀉𓀊',
                '░▒▓█▞▚╬╫╪╩╟╚╗⚝⚯♾️☣️☢️'
            ].join('');

            let password = "";
            const length = Math.floor(Math.random() * 100) + 120; // Between 120 and 220 chars

            for (let i = 0; i < length; i++) {
                password += charPool.charAt(Math.floor(Math.random() * charPool.length));
            }
            display.innerText = password;
        }

        window.onload = applyTheme;
    </script>
</body>
</html>
