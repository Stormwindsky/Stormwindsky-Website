<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Countdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-number {
            font-size: 3.5rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.5rem;
            border-radius: 10px;
            min-width: 80px;
            text-align: center;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .countdown-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .snowflake {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        .music-credit {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.8;
            z-index: 100;
            padding: 0.5rem;
            background-color: rgba(0, 0, 0, 0.5);
            line-height: 1.4;
        }

        .music-credit a {
            color: #4fc3f7;
            text-decoration: none;
        }

        .music-credit a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .countdown {
                gap: 0.8rem;
            }
            
            .countdown-number {
                font-size: 2rem;
                min-width: 60px;
            }
            
            .countdown-label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Christmas Countdown</h1>
        <div class="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>
    </div>

    <div class="music-credit">
        Music: "We Three Kings" (OpenGameArt)<br>
        <span style="font-size: 0.75rem; opacity: 0.8;">Entire project released under the <a href="https://spdx.org/licenses/MIT-0.html" target="_blank" rel="noopener">MIT No Attribution License (MIT-0)</a></span>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://github.com/Stormwindsky/Stormwindsky-Website/raw/refs/heads/main/Public_Domain_Thing/Thing_I_NEVER_made/Musics%20&%20Sounds/OpenGameArtDotOrg/ChristmasSongs/WeThreeKings.mp3" type="audio/mpeg">
    </audio>

    <script>
        /*
          Entire webpage and embedded code released under the MIT No Attribution License (MIT-0).
        */

        // Countdown functionality
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let christmas = new Date(currentYear, 11, 25); // December is month 11
            
            // If Christmas has passed this year, set it to next year
            if (now > christmas) {
                christmas = new Date(currentYear + 1, 11, 25);
            }
            
            const diff = christmas - now;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }
        
        // Initial call and set interval
        updateCountdown();
        setInterval(updateCountdown, 1000);
        
        // Snowflake creation
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // Random size between 2px and 8px
            const size = Math.random() * 6 + 2;
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;
            
            // Random starting position
            snowflake.style.left = `${Math.random() * window.innerWidth}px`;
            snowflake.style.top = '-10px';
            
            // Random opacity
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;
            
            document.body.appendChild(snowflake);
            
            // Animation
            const endPosition = window.innerHeight + 10;
            
            const animate = () => {
                const currentTop = parseFloat(snowflake.style.top);
                const progress = currentTop / endPosition;
                
                // Move down
                snowflake.style.top = `${currentTop + 0.5}px`;
                
                // Slight horizontal movement
                const sway = Math.sin(progress * Math.PI * 5) * 5;
                snowflake.style.transform = `translateX(${sway}px)`;
                
                if (currentTop < endPosition) {
                    requestAnimationFrame(animate);
                } else {
                    snowflake.remove();
                }
            };
            
            requestAnimationFrame(animate);
        }
        
        // Create snowflakes periodically
        setInterval(createSnowflake, 300);
        
        // Background music - will play when user interacts with page
        document.addEventListener('click', function() {
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic.paused) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log('Audio play failed:', e));
            }
        }, { once: true });
    </script>
</body>
</html>
