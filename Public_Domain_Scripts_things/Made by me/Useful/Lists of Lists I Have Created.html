<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stormwindsky - Lists of Lists</title>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Twemoji for consistent emoji rendering across all OS -->
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <!-- Modern fonts with native emoji support -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: rgba(22, 27, 34, 0.92);
            --card-bg: #1c2128;
            --card-hover: #262c36;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --border-color: #30363d;
            --success-color: #238636;
            --success-hover: #2ea043;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Lightweight animated background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
        }

        .container {
            max-width: 960px;
            width: 92%;
            margin: 40px 20px;
            padding: 36px;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 0 0 18px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-github {
            background-color: var(--success-color);
            color: white;
        }

        .btn-github:hover {
            background-color: var(--success-hover);
            transform: translateY(-1px);
        }

        .btn-back {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .btn-back:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            color: #ffffff;
        }

        /* Search bar */
        .search-wrapper {
            margin-bottom: 24px;
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #0d1117;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Folder sections grid */
        .folder-section {
            margin-bottom: 28px;
        }

        .folder-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
            margin: 0 0 14px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .lists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 14px;
        }

        .list-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
        }

        .list-card:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .list-card-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: #f0f6fc;
            line-height: 1.4;
            word-break: break-word;
        }

        .list-card-arrow {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: transform 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        .list-card:hover .list-card-arrow {
            color: var(--accent-color);
            transform: translateX(3px);
        }

        /* Modern Markdown Viewer (GitHub Dark style) */
        #markdown-viewer {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .viewer-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .breadcrumb {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .breadcrumb span {
            color: var(--accent-color);
            font-weight: 500;
        }

        #content {
            line-height: 1.7;
            font-size: 1rem;
            word-wrap: break-word;
        }

        #content h1, #content h2, #content h3 {
            color: #ffffff;
            margin-top: 1.5em;
            margin-bottom: 0.6em;
            font-weight: 600;
        }

        #content h1 { font-size: 1.85rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.35em; }
        #content h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        #content h3 { font-size: 1.15rem; }

        #content a {
            color: var(--accent-color);
            text-decoration: none;
        }

        #content a:hover {
            text-decoration: underline;
        }

        #content ul, #content ol {
            padding-left: 1.6em;
        }

        #content li {
            margin-bottom: 0.45em;
        }

        #content blockquote {
            margin: 1em 0;
            padding: 0.5em 1em;
            color: var(--text-muted);
            border-left: 4px solid var(--accent-color);
            background: rgba(88, 166, 255, 0.05);
            border-radius: 0 6px 6px 0;
        }

        #content code {
            background: #21262d;
            padding: 0.2em 0.45em;
            border-radius: 6px;
            font-size: 0.88em;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        #content pre {
            background: #010409;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        #content pre code {
            background: transparent;
            padding: 0;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2em 0;
            display: block;
            overflow-x: auto;
        }

        #content th, #content td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            text-align: left;
        }

        #content th {
            background-color: #1c2128;
            color: #ffffff;
            font-weight: 600;
        }

        #content tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        #content img:not(.emoji) {
            max-width: 100%;
            border-radius: 8px;
            margin: 10px 0;
        }

        /* Proper sizing for Twemoji emojis */
        img.emoji {
            height: 1.15em;
            width: 1.15em;
            margin: 0 0.08em;
            vertical-align: -0.2em;
            display: inline-block;
        }

        /* GitHub Task Lists Checkboxes */
        #content input[type="checkbox"] {
            accent-color: var(--accent-color);
            margin-right: 6px;
            transform: scale(1.1);
        }

        footer {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.9s linear infinite;
            margin: 40px auto;
        }

        .error-box {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid #f85149;
            color: #ff7b72;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .container { padding: 22px 18px; margin: 20px 10px; }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <h1>📚 Lists of Lists I Have Created</h1>
            <p>Dynamic Markdown Lists Explorer — By Stormwindsky</p>
            <div class="header-actions">
                <a id="repo-link" href="https://github.com/Stormwindsky/Lists-of-lists-I-have-created" class="btn btn-github" target="_blank" rel="noopener noreferrer">
                    🔗 View Repository on GitHub
                </a>
            </div>
        </header>

        <div id="loader" class="loader"></div>

        <!-- View 1: .md files list -->
        <div id="directory-view" style="display: none;">
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="🔍 Search a list (e.g., Homebrews, Games, Linux...)">
            </div>
            <div id="lists-container"></div>
        </div>

        <!-- View 2: Modern Markdown Viewer -->
        <div id="markdown-viewer">
            <div class="viewer-toolbar">
                <button id="back-btn" class="btn btn-back">⬅️ Back to lists</button>
                <div class="breadcrumb" id="file-breadcrumb"></div>
                <a id="github-file-btn" href="#" class="btn btn-github" target="_blank" rel="noopener noreferrer">
                    📄 View on GitHub
                </a>
            </div>
            <div id="content"></div>
        </div>

        <footer>
            <p>Powered by GitHub API • UTF-8 & Emoji Support ✨</p>
        </footer>
    </div>

    <script>
        // --- REPOSITORY CONFIGURATION ---
        const REPO_OWNER = 'Stormwindsky';
        const REPO_NAME = 'Lists-of-lists-I-have-created';
        const BRANCH = 'main';
        const TARGET_FOLDER = 'Lists';

        // --- ANIMATED BACKGROUND (Low Impact) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(88, 166, 255, 0.45)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initBg() {
            particles = [];
            for (let i = 0; i < 55; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initBg();
        animate();

        // --- UTF-8 & EMOJI HANDLING ---
        function decodeBase64UTF8(base64) {
            const binaryString = atob(base64.replace(/\s/g, ''));
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        const emojiShortcodes = {
            ':rocket:': '🚀', ':star:': '⭐', ':sparkles:': '✨', ':fire:': '🔥',
            ':heart:': '❤️', ':check:': '✅', ':white_check_mark:': '✅', ':x:': '❌',
            ':warning:': '⚠️', ':info:': 'ℹ️', ':bulb:': '💡', ':book:': '📖',
            ':books:': '📚', ':video_game:': '🎮', ':computer:': '💻', ':penguin:': '🐧',
            ':gear:': '⚙️', ':wrench:': '🔧', ':hammer:': '🔨', ':link:': '🔗',
            ':folder:': '📁', ':page_facing_up:': '📄', ':trophy:': '🏆', ':tada:': '🎉',
            ':thumbsup:': '👍', ':+1:': '👍', ':eyes:': '👀', ':zap:': '⚡',
            ':globe_with_meridians:': '🌐', ':musical_note:': '🎵', ':art:': '🎨'
        };

        function parseGitHubEmojis(text) {
            return text.replace(/:[a-z0-9_+-]+:/gi, match => emojiShortcodes[match.toLowerCase()] || match);
        }

        function renderTwemoji(element) {
            if (typeof twemoji !== 'undefined') {
                twemoji.parse(element, { folder: 'svg', ext: '.svg' });
            }
        }

        function encodeGitHubPath(path) {
            return path.split('/').map(segment => encodeURIComponent(segment)).join('/');
        }

        // --- GITHUB API LOGIC ---
        let allMarkdownFiles = [];

        const loaderEl = document.getElementById('loader');
        const directoryViewEl = document.getElementById('directory-view');
        const listsContainerEl = document.getElementById('lists-container');
        const markdownViewerEl = document.getElementById('markdown-viewer');
        const contentEl = document.getElementById('content');
        const searchInputEl = document.getElementById('search-input');
        const backBtnEl = document.getElementById('back-btn');
        const githubFileBtnEl = document.getElementById('github-file-btn');
        const fileBreadcrumbEl = document.getElementById('file-breadcrumb');

        marked.setOptions({
            gfm: true,
            breaks: true
        });

        async function fetchAllLists() {
            const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;

            try {
                const response = await fetch(treeUrl);
                if (!response.ok) {
                    throw new Error(`GitHub API Error (${response.status})`);
                }
                const data = await response.json();

                allMarkdownFiles = data.tree
                    .filter(item =>
                        item.type === 'blob' &&
                        item.path.startsWith(`${TARGET_FOLDER}/`) &&
                        item.path.toLowerCase().endsWith('.md')
                    )
                    .map(item => {
                        const parts = item.path.split('/');
                        const fileName = parts[parts.length - 1];
                        const cleanTitle = fileName.replace(/\.md$/i, '');
                        const subFolder = parts.length > 2 ? parts.slice(1, -1).join(' / ') : 'General';

                        return {
                            path: item.path,
                            fileName: fileName,
                            title: cleanTitle,
                            folder: subFolder,
                            githubUrl: `https://github.com/${REPO_OWNER}/${REPO_NAME}/blob/${BRANCH}/${encodeGitHubPath(item.path)}`
                        };
                    });

                loaderEl.style.display = 'none';
                renderDirectory(allMarkdownFiles);
                handleInitialHash();

            } catch (error) {
                console.error('Error fetching lists:', error);
                loaderEl.style.display = 'none';
                directoryViewEl.style.display = 'block';
                listsContainerEl.innerHTML = `
                    <div class="error-box">
                        <p>⚠️ Failed to load lists from GitHub.</p>
                        <small>${error.message} (Please check your connection or GitHub API rate limits).</small>
                    </div>
                `;
            }
        }

        function renderDirectory(files) {
            directoryViewEl.style.display = 'block';
            markdownViewerEl.style.display = 'none';
            listsContainerEl.innerHTML = '';

            if (files.length === 0) {
                listsContainerEl.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No lists found.</p>';
                return;
            }

            const grouped = files.reduce((acc, file) => {
                if (!acc[file.folder]) acc[file.folder] = [];
                acc[file.folder].push(file);
                return acc;
            }, {});

            const sortedFolders = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            sortedFolders.forEach(folder => {
                const section = document.createElement('div');
                section.className = 'folder-section';

                const folderHeader = document.createElement('h2');
                folderHeader.className = 'folder-title';
                folderHeader.innerHTML = `📂 ${folder} <span style="font-size:0.8em; color:var(--text-muted); font-weight:400;">(${grouped[folder].length})</span>`;
                section.appendChild(folderHeader);

                const grid = document.createElement('div');
                grid.className = 'lists-grid';

                grouped[folder].forEach(file => {
                    const card = document.createElement('button');
                    card.className = 'list-card';
                    card.type = 'button';
                    card.innerHTML = `
                        <span class="list-card-title">📝 ${file.title}</span>
                        <span class="list-card-arrow">→</span>
                    `;
                    card.addEventListener('click', () => openMarkdownFile(file));
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                listsContainerEl.appendChild(section);
            });

            renderTwemoji(listsContainerEl);
        }

        async function openMarkdownFile(file) {
            directoryViewEl.style.display = 'none';
            markdownViewerEl.style.display = 'none';
            loaderEl.style.display = 'block';

            window.history.pushState({ path: file.path }, '', `#${encodeURIComponent(file.path)}`);

            githubFileBtnEl.href = file.githubUrl;
            fileBreadcrumbEl.innerHTML = `Lists / ${file.folder} / <span>${file.title}</span>`;

            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeGitHubPath(file.path)}?ref=${BRANCH}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`File not found (${response.status})`);
                const data = await response.json();

                const rawMarkdown = decodeBase64UTF8(data.content);
                const emojiReadyMarkdown = parseGitHubEmojis(rawMarkdown);

                contentEl.innerHTML = marked.parse(emojiReadyMarkdown);

                contentEl.querySelectorAll('a').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });

                contentEl.querySelectorAll('pre code').forEach(el => {
                    hljs.highlightElement(el);
                });

                renderTwemoji(contentEl);
                renderTwemoji(fileBreadcrumbEl);

                loaderEl.style.display = 'none';
                markdownViewerEl.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error('Error reading Markdown file:', error);
                loaderEl.style.display = 'none';
                markdownViewerEl.style.display = 'block';
                contentEl.innerHTML = `
                    <div class="error-box">
                        <p>❌ Failed to load content for <strong>${file.title}</strong>.</p>
                        <p><a href="${file.githubUrl}" target="_blank" style="color: #58a6ff;">View directly on GitHub</a></p>
                    </div>
                `;
            }
        }

        searchInputEl.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allMarkdownFiles.filter(f =>
                f.title.toLowerCase().includes(query) ||
                f.folder.toLowerCase().includes(query)
            );
            renderDirectory(filtered);
        });

        backBtnEl.addEventListener('click', () => {
            window.history.pushState({}, '', window.location.pathname);
            markdownViewerEl.style.display = 'none';
            directoryViewEl.style.display = 'block';
        });

        window.addEventListener('popstate', () => {
            handleInitialHash();
        });

        function handleInitialHash() {
            const hash = window.location.hash.slice(1);
            if (hash) {
                const decodedPath = decodeURIComponent(hash);
                const foundFile = allMarkdownFiles.find(f => f.path === decodedPath);
                if (foundFile) {
                    openMarkdownFile(foundFile);
                    return;
                }
            }
            markdownViewerEl.style.display = 'none';
            directoryViewEl.style.display = 'block';
        }

        renderTwemoji(document.querySelector('header'));
        fetchAllLists();
    </script>
</body>
</html>
