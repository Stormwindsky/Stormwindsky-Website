<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  
  const owner = params.get('owner') || 'octocat';
  const repo = params.get('repo') || 'Hello-World';
  const ref = params.get('ref') || 'main';
  const ext = params.get('ext') || 'zip';

  const githubUrl = `https://codeload.github.com/${owner}/${repo}/zip/refs/heads/${ref}`;

  const a = document.createElement('a');
  a.href = githubUrl;
  a.download = `${repo}-${ref}.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
</script>
</body>
</html>
