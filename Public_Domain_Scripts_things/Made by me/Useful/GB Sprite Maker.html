<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Sprite Maker</title>
    <style>
        :root {
            --bg-body: #f0f0f0;
            --card-bg: #ffffff;
            --text-dark: #1d1d1f;
            --text-dim: #86868b;
            --accent: #007aff;

            --gb-transparent: #65ff00;
            --gb-light: #8bac0f;
            --gb-dark: #306230;
            --gb-black: #0f380f;
        }

        [data-theme="dark"] {
            --bg-body: #0a0a0a;
            --card-bg: #1c1c1e;
            --text-dark: #f5f5f7;
            --text-dim: #a1a1a6;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            transition: background 0.3s, color 0.3s; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .controls {
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            justify-content: center;
        }

        .theme-toggle, .btn-main {
            padding: 8px 15px; 
            border-radius: 12px; 
            border: 1px solid var(--text-dim);
            background: var(--card-bg); 
            color: var(--text-dark); 
            cursor: pointer;
            font-family: 'Inter', sans-serif; 
            font-weight: 600;
        }

        .editor-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            border: 2px solid var(--text-dark);
            width: 400px;
            height: 400px;
            background-size: 16px 16px;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
        }

        .pixel {
            width: 25px;
            height: 25px;
            border: 0.1px solid rgba(0,0,0,0.05);
            background-color: var(--gb-transparent);
            cursor: crosshair;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .palette {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .color-btn {
            height: 45px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            position: relative;
        }

        .color-btn.active {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .color-btn[data-color="#65ff00"]::after {
            content: 'TRANS';
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            color: #000;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .preview-box {
            text-align: center;
            background: rgba(0,0,0,0.05);
            padding: 15px;
            border-radius: 15px;
        }

        #preview-canvas {
            image-rendering: pixelated;
            border: 1px solid var(--text-dim);
            margin-top: 10px;
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 8px 8px;
            background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
        }

        .btn-main {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
        }

        .size-select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--text-dim);
            background: var(--card-bg);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        footer { 
            margin-top: 40px; 
            font-size: 0.8rem; 
            color: var(--text-dim); 
            text-align: center; 
            max-width: 800px;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            #grid { width: 300px; height: 300px; }
            .pixel { width: 18.75px; height: 18.75px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    </div>

    <div class="editor-container">
        <div id="grid"></div>

        <div class="sidebar">
            <h2 id="txt-palette">Palette</h2>
            <div class="palette">
                <div class="color-btn active" style="background: var(--gb-black);" data-color="#0f380f"></div>
                <div class="color-btn" style="background: var(--gb-dark);" data-color="#306230"></div>
                <div class="color-btn" style="background: var(--gb-light);" data-color="#8bac0f"></div>
                <div class="color-btn" style="background: var(--gb-transparent);" data-color="#65ff00" title="Transparent for GB Studio"></div>
            </div>

            <label for="sizeSelect" style="font-weight:600; font-size:0.9rem;">Export size:</label>
            <select id="sizeSelect" class="size-select">
                <option value="1">16×16 (1x)</option>
                <option value="4" selected>64×64 (4x)</option>
                <option value="8">128×128 (8x)</option>
                <option value="16">256×256 (16x)</option>
            </select>

            <button class="btn-main" onclick="exportPNG()" id="btn-export">Export PNG (with transparency)</button>
            <button class="theme-toggle" onclick="clearGrid()" id="btn-clear">Reset</button>

            <div class="preview-box">
                <span id="txt-preview">Preview the Sprite (16x16)</span><br>
                <canvas id="preview-canvas" width="16" height="16"></canvas>
            </div>
        </div>
    </div>

    <footer id="txt-footer">
        <strong>MIT No Attribution</strong><br><br>
        Copyright 2026 Stormwindsky
    </footer>

    <script>
        const GB_TRANSPARENT_COLOR = '#65ff00';
        const GRID_SIZE = 16;

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const theme = localStorage.getItem('theme') || 'light';
            document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        const grid = document.getElementById('grid');
        const previewCanvas = document.getElementById('preview-canvas');
        const ctx = previewCanvas.getContext('2d');
        let currentColor = '#0f380f';
        let isDrawing = false;

        function initGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const pixel = document.createElement('div');
                pixel.classList.add('pixel');
                pixel.dataset.color = GB_TRANSPARENT_COLOR;
                pixel.style.backgroundColor = GB_TRANSPARENT_COLOR;
                
                pixel.addEventListener('mousedown', (e) => { 
                    e.preventDefault();
                    isDrawing = true; 
                    paint(pixel); 
                });
                pixel.addEventListener('mouseover', () => { 
                    if(isDrawing) paint(pixel); 
                });
                grid.appendChild(pixel);
            }
        }

        function paint(el) {
            el.dataset.color = currentColor;
            el.style.backgroundColor = currentColor;
            updatePreview();
        }

        function updatePreview() {
            ctx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
            const pixels = document.querySelectorAll('.pixel');
            
            pixels.forEach((p, i) => {
                const x = i % GRID_SIZE;
                const y = Math.floor(i / GRID_SIZE);
                const color = p.dataset.color || GB_TRANSPARENT_COLOR;

                if (color === GB_TRANSPARENT_COLOR) {
                    ctx.fillStyle = '#65ff00';
                    ctx.fillRect(x, y, 1, 1);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, 1, 1);
                }
            });
        }

        function clearGrid() {
            document.querySelectorAll('.pixel').forEach(p => {
                p.dataset.color = GB_TRANSPARENT_COLOR;
                p.style.backgroundColor = GB_TRANSPARENT_COLOR;
            });
            updatePreview();
        }

        function exportPNG() {
            const scale = parseInt(document.getElementById('sizeSelect').value, 10) || 1;
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = GRID_SIZE * scale;
            exportCanvas.height = GRID_SIZE * scale;
            const ectx = exportCanvas.getContext('2d');

            ectx.clearRect(0, 0, exportCanvas.width, exportCanvas.height);

            const pixels = document.querySelectorAll('.pixel');
            pixels.forEach((p, i) => {
                const x = i % GRID_SIZE;
                const y = Math.floor(i / GRID_SIZE);
                const color = p.dataset.color || GB_TRANSPARENT_COLOR;

                // Si c'est la couleur "transparente", on ne dessine RIEN -> alpha = 0
                if (color === GB_TRANSPARENT_COLOR) {
                    return;
                }

                ectx.fillStyle = color;
                ectx.fillRect(x * scale, y * scale, scale, scale);
            });

            const link = document.createElement('a');
            link.download = 'sprite_gbstudio_' + exportCanvas.width + 'x' + exportCanvas.height + '.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        window.addEventListener('mouseup', () => isDrawing = false);

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const activeBtn = document.querySelector('.color-btn.active');
                if(activeBtn) activeBtn.classList.remove('active');
                btn.classList.add('active');
                currentColor = btn.getAttribute('data-color');
            });
        });

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            initGrid();
            updateThemeButtonText();
            updatePreview();
        };
    </script>
</body>
</html>
